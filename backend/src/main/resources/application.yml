server:
  port: ${PORT:8080}

spring:
  application:
    name: lab-resource-platform

  datasource:
    # Supports PostgreSQL as primary or H2 in-memory for local dev if Postgres is not configured
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:lab_resource_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
    open-in-view: false

  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console
      settings:
        web-allow-others: false

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

# Application Configuration (Configured via environment variables)
app:
  jwt:
    # 256-bit secret key (configurable via JWT_SECRET environment variable)
    secret: ${JWT_SECRET:c3VwZXJTZWNyZXRMYWJSZXNvdXJjZVV0aWxpemF0aW9uUGxhdGZvcm1TZWN1cmVLZXkyMDI2}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  storage:
    upload-dir: ${STORAGE_UPLOAD_DIR:./uploads}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
